name: MAUI Unit Tests

on:
  push:
    branches:
      - main
      - develop
      - feature/*
      - hotfix/*
      - release/*
  pull_request:
    branches:
      - main
      - feature/*
      - hotfix/*
      - release/*
      - develop

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
          include-prerelease: true

      - name: Add .NET 9 NuGet Sources
        run: |
          dotnet nuget add source https://pkgs.dev.azure.com/dnceng/public/_packaging/dotnet9/nuget/v3/index.json --name dotnet9
          dotnet nuget add source https://pkgs.dev.azure.com/dnceng/public/_packaging/dotnet-public/nuget/v3/index.json --name dotnet-public

      - name: Install MAUI workloads
        run: dotnet workload install maui-windows

      - name: Restore dependencies
        run: dotnet restore -r win-x64

      - name: Build the application
        run: dotnet build ProjectBotenReservering.App/ProjectBotenReservering.App.csproj --configuration Release --framework net9.0-windows10.0.19041.0 -r win-x64

      - name: Run unit tests
        run: dotnet test --configuration Release --verbosity normal --results-directory "TestResults" --logger "trx;LogFileName=testresults.trx"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-windows
          path: TestResults/testresults.trx
