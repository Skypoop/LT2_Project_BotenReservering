<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Reservering Bevestiging</title>
</head>
<body style="margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(to bottom, #AE1C28 0%, #AE1C28 33%, #FFFFFF 33%, #FFFFFF 66%, #21468B 66%, #21468B 100%); background-color: #FFFFFF; height: 100vh;">
    <table role="presentation" width="100%" border="0" cellspacing="0" cellpadding="0" style="width: 100%; height: 100%; min-height: 600px;">
        <tr>
            <td align="center" valign="middle" style="padding: 20px;">
                <table role="presentation" width="600" border="0" cellspacing="0" cellpadding="0" style="background-color: #ffffff; border-radius: 0px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #ddd;">
                    <tr>
                        <td height="8" style="background-color: #F36C21;"></td>
                    </tr>
                    <tr>
                        <td style="padding: 30px 30px 10px 30px; text-align: center;">
                            <h1 style="color: #21468B; margin: 0; font-size: 26px; text-transform: uppercase; letter-spacing: 1px;">Reservering</h1>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding: 20px 40px 40px 40px; color: #000000; font-size: 16px; line-height: 1.6;">
                            <p style="margin-top: 0;">Beste <strong>{Name}</strong>,</p>

                            <p>Je bent toegevoegd aan een reservering!</p>
                            <div style="background-color: #F36C21; color: #ffffff; padding: 20px; margin: 25px 0; box-shadow: 3px 3px 0px #21468B;">
                                <table width="100%" border="0" cellspacing="0" cellpadding="0">
                                    <tr>
                                        <td style="color: #ffffff; font-size: 14px; text-transform: uppercase; font-weight: bold;">Starttijd</td>
                                        <td style="color: #ffffff; font-size: 18px; text-align: right; font-weight: bold;">{StartTime}</td>
                                    </tr>
                                    <tr>
                                        <td style="border-top: 2px solid #ffffff; height: 10px;" colspan="2"></td>
                                    </tr>
                                    <tr>
                                        <td style="color: #ffffff; font-size: 14px; text-transform: uppercase; font-weight: bold;">Eindtijd</td>
                                        <td style="color: #ffffff; font-size: 18px; text-align: right; font-weight: bold;">{EndTime}</td>
                                    </tr>
                                </table>
                            </div>
                            <h3 style="color: #AE1C28; margin-bottom: 10px; text-transform: uppercase; font-size: 14px; border-bottom: 2px solid #AE1C28; display: inline-block;">Jouw Roeiteam</h3>
                            <div style="padding-top: 10px;">
                                <p style="margin: 0; font-size: 16px; color: #333;">
                                    &#128675; {OtherRowers}
                                </p>
                            </div>

                            <p style="margin-top: 40px; margin-bottom: 0;">Met sportieve groet,<br><strong>De Roeivereniging</strong></p>
                        </td>
                    </tr>
                    <tr>
                        <td height="15" style="background-color: #21468B;"></td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
